[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-roadtrip"
dynamic = ["version"]
description = "NetBox plugin, just for fun: drive a car through a city made of your tenants, sites and devices"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "vinceneil666" }]
keywords = ["netbox", "netbox-plugin", "game", "fun"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/vinceneil666/netbox-plugins/tree/main/roadtrip"
Issues = "https://github.com/vinceneil666/netbox-plugins/issues"

[tool.setuptools.dynamic]
version = { attr = "netbox_roadtrip.__version__" }

[tool.setuptools.packages.find]
include = ["netbox_roadtrip*"]

[tool.setuptools.package-data]
netbox_roadtrip = ["templates/**/*"]
