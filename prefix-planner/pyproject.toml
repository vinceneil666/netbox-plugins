[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-prefix-planner"
dynamic = ["version"]
description = "NetBox plugin: plan a tenant's address block with sliders and provision the tenant and its prefixes in one go"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "vinceneil666" }]
keywords = ["netbox", "netbox-plugin", "ipam", "prefix", "subnetting"]
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/vinceneil666/netbox-plugins/tree/main/prefix-planner"
Issues = "https://github.com/vinceneil666/netbox-plugins/issues"

[project.optional-dependencies]
test = ["pytest", "netaddr"]

[tool.setuptools.dynamic]
version = { attr = "netbox_prefix_planner.__version__" }

[tool.setuptools.packages.find]
include = ["netbox_prefix_planner*"]

[tool.setuptools.package-data]
netbox_prefix_planner = ["templates/**/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
